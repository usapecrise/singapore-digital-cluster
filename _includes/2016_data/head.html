<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- PAGE TITLE -->
    <title>
        {% if page.title %}
            {{ page.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <!-- META -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">

    <!-- CANONICAL URL -->
    <link rel="canonical"
          href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- JEKYLL SEO -->
    {% seo %}


    <!-- =====================================================
         CORE CSS
         Files are located in:
         _includes/2016_css/
    ====================================================== -->

    <style>
        {% include 2016_css/bootstrap.min.css %}
        {% include 2016_css/agency.css %}
    </style>


    <!-- =====================================================
         FONT AWESOME
         Located in:
         css/2016_style/font-awesome/
    ====================================================== -->

    <link rel="stylesheet"
          href="{{ site.baseurl }}/css/2016_style/font-awesome/css/font-awesome.min.css">


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700"
          rel="stylesheet"
          type="text/css">

    <link href="https://fonts.googleapis.com/css?family=Kaushan+Script"
          rel="stylesheet"
          type="text/css">

    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic"
          rel="stylesheet"
          type="text/css">

    <link href="https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic"
          rel="stylesheet"
          type="text/css">

    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700"
          rel="stylesheet"
          type="text/css">


    <!-- =====================================================
         WEBSITE ICON
    ====================================================== -->

    <link rel="icon"
          type="image/png"
          href="{{ site.baseurl }}/css/2016_style/img/icon.png">


    <!-- =====================================================
         GOOGLE ANALYTICS
         Remove this block if Google Analytics is not being used.
    ====================================================== -->

    <script>
        (function(i,s,o,g,r,a,m){
            i['GoogleAnalyticsObject']=r;
            i[r]=i[r]||function(){
                (i[r].q=i[r].q||[]).push(arguments)
            },
            i[r].l=1*new Date();

            a=s.createElement(o),
            m=s.getElementsByTagName(o)[0];

            a.async=1;
            a.src=g;
            m.parentNode.insertBefore(a,m)

        })(window,document,'script',
           'https://www.google-analytics.com/analytics.js','ga');

        ga('create', 'UA-xxxxxxxx-x', 'auto');
        ga('send', 'pageview');
    </script>


    <!-- =====================================================
         HTML5 SHIM / RESPOND.JS
         Support for older versions of Internet Explorer
    ====================================================== -->

    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>
